name: apbackup-platform-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: apbackup_dev
      POSTGRES_USER: apbackup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5549:5432'
    volumes:
      - apbackup_catalog_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apbackup -d apbackup_dev']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  apbackup_catalog_dev:
